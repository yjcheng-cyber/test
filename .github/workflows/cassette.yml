# Diagnostic workflow for artifact CreateArtifact field parsing.
name: cassette
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe CreateArtifact fields
        uses: actions/github-script@v8
        env:
          GH_API_TOKEN: ${{ github.token }}
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            execFileSync('python3', ['solve/probe_artifact_fields.py'], { stdio: 'inherit' })
