# Drop this at .github/workflows/cassette.yml in a repository you own, then run
# it from the Actions tab. It publishes the Repo Cassette payload as an Actions
# artifact whose stored mime type carries U+0085, and prints the two values
# solve/pwn.py needs.
name: cassette
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish payload artifact
        uses: actions/github-script@v8
        env:
          GH_API_TOKEN: ${{ github.token }}
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            execFileSync('python3', ['solve/probe_mime.py'], { stdio: 'inherit' })
            execFileSync('python3', ['solve/gh_artifact.py'], { stdio: 'inherit' })
