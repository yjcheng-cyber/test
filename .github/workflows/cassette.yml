# Drop this at .github/workflows/cassette.yml in a repository you own, then run
# it from the Actions tab. This is a diagnostic workflow: GitHub's current
# backend returns application/zip for the U+0085 artifact, so its output is
# not a working remote exploit. See NOTES.md before running it again.
name: cassette
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish payload artifact
        uses: actions/github-script@v8
        env:
          GH_API_TOKEN: ${{ github.token }}
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            execFileSync('python3', ['solve/probe_mime.py'], { stdio: 'inherit' })
            execFileSync('python3', ['solve/probe_name.py'], { stdio: 'inherit' })
            execFileSync('python3', ['solve/gh_artifact.py'], { stdio: 'inherit' })
