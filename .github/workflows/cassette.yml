# Diagnostic workflow for the v7 artifact blob Content-Type experiment.
name: cassette
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe v7 blob metadata
        uses: actions/github-script@v8
        env:
          GH_API_TOKEN: ${{ github.token }}
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            execFileSync('python3', ['solve/probe_v7_blob_type.py'], { stdio: 'inherit' })
