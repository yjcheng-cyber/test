# Diagnostic workflow for same-name artifact version recreation.
name: cassette
on: workflow_dispatch
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe artifact version recreation
        uses: actions/github-script@v8
        env:
          GH_API_TOKEN: ${{ github.token }}
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            execFileSync('python3', ['solve/probe_version_recreate.py'], { stdio: 'inherit' })
